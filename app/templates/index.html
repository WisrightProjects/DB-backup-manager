<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backup Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app">
    <!-- ── Sidebar ── -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
            <path d="M4 7c0-1.66 3.58-3 8-3s8 1.34 8 3-3.58 3-8 3-8-1.34-8-3Z" stroke="currentColor" stroke-width="1.6"/>
            <path d="M4 7v5c0 1.66 3.58 3 8 3s8-1.34 8-3V7" stroke="currentColor" stroke-width="1.6"/>
            <path d="M4 12v5c0 1.66 3.58 3 8 3s8-1.34 8-3v-5" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </div>
        <div class="brand-text"><strong>Backup Manager</strong><span>Restic console</span></div>
      </div>

      <div class="search">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/><path d="m11 11 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input id="search" type="text" placeholder="Search projects…" autocomplete="off">
      </div>

      <nav class="nav">
        <button class="nav-item active" id="fleetNav">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="2" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/></svg>
          Fleet Health
        </button>
        <div class="nav-label">Projects <span id="projCount" class="nav-count"></span></div>
        <ul id="projectList" class="project-list"></ul>
      </nav>

      <button class="btn btn-primary btn-add" id="addBtn">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Add Project
      </button>
    </aside>

    <!-- ── Main ── -->
    <main class="main">
      <header class="topbar">
        <div class="crumb" id="crumb">Fleet Health</div>
        <div class="topbar-right">
          <div class="legend">
            <span><i class="dot ok"></i>Healthy</span>
            <span><i class="dot warn"></i>Stale</span>
            <span><i class="dot idle"></i>No data</span>
          </div>
          <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
            <svg class="ico-moon" viewBox="0 0 16 16" width="16" height="16" fill="none"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3c0-.4.04-.79.12-1.16A5.5 5.5 0 1 0 14.16 9.4c-.37.07-.76.1-1.16.1Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            <svg class="ico-sun" viewBox="0 0 16 16" width="16" height="16" fill="none"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3 3l1 1M12 12l1 1M13 3l-1 1M4 12l-1 1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>

  <!-- ── Add/Edit slide-over ── -->
  <div class="overlay" id="overlay"></div>
  <aside class="slideover" id="slideover" aria-hidden="true"></aside>

  <!-- ── Confirm modal ── -->
  <div class="modal-wrap" id="confirmWrap">
    <div class="modal">
      <h3 id="confirmTitle">Confirm</h3>
      <p id="confirmBody"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirmCancel">Cancel</button>
        <button class="btn btn-danger" id="confirmOk">Confirm</button>
      </div>
    </div>
  </div>

  <!-- ── Restore modal (scope + typed confirm — BKP-1.6 / AC9) ── -->
  <div class="modal-wrap" id="restoreWrap">
    <div class="modal">
      <h3>Restore snapshot</h3>
      <p id="restoreBody"></p>

      <div class="fgroup" style="margin-top:16px;">
        <span class="flabel">What to restore</span>
        <div class="seg" id="restoreScope">
          <label><input type="radio" name="restoreScope" value="all" checked>Everything</label>
          <label><input type="radio" name="restoreScope" value="db">Database only</label>
          <label><input type="radio" name="restoreScope" value="files">Files only</label>
        </div>
      </div>

      <div class="fgroup" style="margin-top:16px;">
        <span class="flabel">Type the project name <b id="restoreName" class="mono"></b> to confirm</span>
        <input type="text" id="restoreConfirmInput" class="finput" autocomplete="off"
               spellcheck="false" placeholder="project name">
        <span class="fhint">This overwrites the selected data and cannot be undone.</span>
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" id="restoreCancel">Cancel</button>
        <button class="btn btn-danger" id="restoreOk" disabled>Restore</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="/static/forms.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
