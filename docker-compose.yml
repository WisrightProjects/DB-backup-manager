networks:
  coolify:
    external: true

services:
  backup-manager:
    build: .
    ports:
      - "8100:8000"
    networks:
      - coolify
    environment:
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-changeme}
      - RESTIC_REPO=s3:https://eu2.contabostorage.com/wisright-backups
      - RESTIC_PASSWORD_FILE=/opt/backups/.restic-pass
      - BACKUP_SCRIPT=/opt/backups/backup-prod.sh
      - BACKUP_LOG=/opt/backups/backup.log
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - DB_CONTAINER_NAME=ac0k8s488okksoo4cggo4wc4
      - DB_USER=mariadb
      - DB_PASS=${DB_PASS}
      - DB_NAME=driveev_prod
      - WP_RESOURCE_ID=j4gcw00koks488wkscs448kc
      - PG_CONTAINER=nckow088o4kss4ksw8k0ck80
      - PG_USER=postgres
      - PG_PASS=${PG_PASS}
      - PG_DB=postgres
      - HOST_BACKUP_ROOT=${HOST_BACKUP_ROOT:-/srv}
    volumes:
      - /opt/backups:/opt/backups:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes:rw
      - ${HOST_BACKUP_ROOT:-/srv}:${HOST_BACKUP_ROOT:-/srv}:rw   # backup + restore host dirs (BKP-1)
      - /data/coolify/applications:/srv/coolify-apps:ro          # Coolify app data (backup source, read-only)
    restart: unless-stopped
